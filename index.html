<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo de Pagamento Online</title>

  <!-- Biblioteca para Geração Direta de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* Variáveis de Cores para Tema Claro (Padrão) */
    :root {
      --primary: #003366;
      --primary-hover: #002244;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --border: #dcdfe6;
      --text: #2c3e50;
      --text-muted: #718096;
      --input-bg: #ffffff;
      --badge-bg: #e6f0fa;
      --badge-text: #003366;
      --sig-bg: #fafbfc;
      --canvas-bg: #ffffff;
      --placeholder: #a0aec0;
      --btn-sec-bg: #edf2f7;
      --btn-sec-text: #4a5568;
      --btn-sec-hover: #e2e8f0;
      --whatsapp-color: #25D366;
      --whatsapp-hover: #1da851;
      --shadow: rgba(0, 0, 0, 0.08);
      --pen-color: #002244;
      --error-color: #e53e3e;
    }

    /* Variáveis de Cores para Tema Escuro */
    [data-theme="dark"] {
      --primary: #3182ce;
      --primary-hover: #2b6cb0;
      --bg: #1a202c;
      --card-bg: #2d3748;
      --border: #4a5568;
      --text: #f7fafc;
      --text-muted: #a0aec0;
      --input-bg: #1a202c;
      --badge-bg: #2b6cb0;
      --badge-text: #ffffff;
      --sig-bg: #212936;
      --canvas-bg: #1a202c;
      --placeholder: #718096;
      --btn-sec-bg: #4a5568;
      --btn-sec-text: #edf2f7;
      --btn-sec-hover: #718096;
      --shadow: rgba(0, 0, 0, 0.4);
      --pen-color: #63b3ed;
      --error-color: #fc8181;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .receipt-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 820px;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px var(--shadow);
      border: 1px solid var(--border);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .theme-toggle {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .theme-toggle:hover {
      background: var(--btn-sec-hover);
    }

    .receipt-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .receipt-header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .receipt-badge {
      font-weight: bold;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    label .req {
      color: #e53e3e;
      margin-left: 2px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
    }

    input.invalid {
      border-color: var(--error-color) !important;
      box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.2) !important;
    }

    .error-msg {
      display: none;
      color: var(--error-color);
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 4px;
    }

    input.invalid + .error-msg {
      display: block;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Área da Assinatura */
    .signature-area {
      margin-top: 25px;
      border: 1.5px dashed var(--primary);
      background: var(--sig-bg);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 170px;
      background: var(--canvas-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
    }

    canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
      display: block;
    }

    .signature-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--placeholder);
      font-size: 0.9rem;
      pointer-events: none;
      user-select: none;
      font-style: italic;
    }

    .signature-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .btn-clear {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Botões */
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      padding: 13px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
    }

    .btn-secondary:hover {
      background: var(--btn-sec-hover);
    }

    .btn-whatsapp {
      background: var(--whatsapp-color);
      color: #ffffff;
    }

    .btn-whatsapp:hover {
      background: var(--whatsapp-hover);
    }

    @media (max-width: 600px) {
      .receipt-container {
        padding: 22px 18px;
      }

      .receipt-header h1 {
        font-size: 1.25rem;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      :root {
        --bg: #ffffff !important;
        --card-bg: #ffffff !important;
        --text: #000000 !important;
        --border: #cccccc !important;
        --primary: #000000 !important;
        --pen-color: #000000 !important;
      }

      body {
        background: white !important;
        padding: 0 !important;
      }

      .receipt-container {
        box-shadow: none !important;
        border: none !important;
        padding: 10px !important;
        max-width: 100% !important;
      }

      .top-bar, .actions, .btn-clear, .signature-placeholder, .error-msg {
        display: none !important;
      }

      .canvas-wrapper {
        border: none !important;
        border-bottom: 1px solid #000 !important;
        background: transparent !important;
      }

      input, textarea {
        border: none !important;
        border-bottom: 1px solid #aaa !important;
        border-radius: 0 !important;
        background: transparent !important;
        padding: 4px 0 !important;
      }
    }
  </style>
</head>
<body>

  <div class="receipt-container" id="receiptCard">
    <div class="top-bar">
      <span></span>
      <button type="button" class="theme-toggle" id="btnThemeToggle" aria-label="Alternar Tema">
        <span id="themeIcon">🌙</span> <span id="themeText">Modo Escuro</span>
      </button>
    </div>

    <div class="receipt-header">
      <h1>Recibo de Pagamento</h1>
      <span class="receipt-badge" id="receiptNumber">Nº #REC-0000</span>
    </div>

    <form id="receiptForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="amount">Valor (R$)<span class="req">*</span></label>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
        </div>
        <div class="form-group">
          <label for="date">Data do Pagamento<span class="req">*</span></label>
          <input type="date" id="date" required>
        </div>
      </div>

      <!-- Dados do Pagador -->
      <div class="form-row">
        <div class="form-group">
          <label for="payer">Recebi(emos) de (Nome do Pagador)<span class="req">*</span></label>
          <input type="text" id="payer" placeholder="Ex: João da Silva" required>
        </div>
        <div class="form-group">
          <label for="payerCpf">CPF ou CNPJ do Pagador<span class="req">*</span></label>
          <input type="text" id="payerCpf" placeholder="000.000.000-00" maxlength="18" required>
          <span class="error-msg">CPF/CNPJ inválido ou falso. Verifique os números.</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="payerEmail">E-mail do Pagador<span class="req">*</span></label>
          <input type="email" id="payerEmail" placeholder="exemplo@email.com" required>
        </div>
        <div class="form-group">
          <label for="amountWords">A quantia de (por extenso)<span class="req">*</span></label>
          <input type="text" id="amountWords" placeholder="Preenchimento automático" required>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Referente a (Descrição do Serviço / Produto)<span class="req">*</span></label>
        <textarea id="description" placeholder="Ex: Serviços prestados de consultoria técnica em T.I." required></textarea>
      </div>

      <!-- Dados do Recebedor -->
      <div class="form-row">
        <div class="form-group">
          <label for="receiver">Nome de quem está Recebendo<span class="req">*</span></label>
          <input type="text" id="receiver" placeholder="Seu nome ou nome da sua empresa" required>
        </div>
        <div class="form-group">
          <label for="receiverCpf">CPF ou CNPJ do Recebedor<span class="req">*</span></label>
          <input type="text" id="receiverCpf" placeholder="000.000.000-00" maxlength="18" required>
          <span class="error-msg">CPF/CNPJ inválido ou falso. Verifique os números.</span>
        </div>
      </div>

      <!-- Área da Assinatura -->
      <div class="signature-area">
        <label>Assinatura Digital do Recebedor<span class="req">*</span>:</label>
        <div class="canvas-wrapper">
          <span class="signature-placeholder" id="placeholderText">Desenhe a sua assinatura aqui com o dedo ou mouse</span>
          <canvas id="signatureCanvas"></canvas>
        </div>
        <div class="signature-controls">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Assinatura obrigatória</span>
          <button type="button" class="btn-clear" id="btnClearSignature">Limpar Assinatura</button>
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="actions">
        <button type="submit" class="btn btn-primary">✉️ Enviar E-mail</button>
        <button type="button" class="btn btn-secondary" onclick="baixarPDF()">📄 Baixar PDF</button>
        <button type="button" class="btn btn-whatsapp" onclick="compartilharWhatsApp()">💬 WhatsApp</button>
        <button type="button" class="btn btn-secondary" onclick="window.print()">🖨️ Imprimir</button>
      </div>
    </form>
  </div>

  <script>
    // -------------------------------------------------------------
    // REFERÊNCIAS DO DOM E ESTADO GLOBAL
    // -------------------------------------------------------------
    const htmlElement = document.documentElement;
    const btnThemeToggle = document.getElementById("btnThemeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    const canvas = document.getElementById("signatureCanvas");
    const ctx = canvas.getContext("2d");
    const placeholder = document.getElementById("placeholderText");
    let isDrawing = false;
    let hasSigned = false;

    // -------------------------------------------------------------
    // GERENCIAMENTO DO TEMA CLARO / ESCURO (DARK MODE)
    // -------------------------------------------------------------
    function applyTheme(theme) {
      htmlElement.setAttribute("data-theme", theme);
      if (theme === "dark") {
        themeIcon.innerText = "☀️";
        themeText.innerText = "Modo Claro";
      } else {
        themeIcon.innerText = "🌙";
        themeText.innerText = "Modo Escuro";
      }
      localStorage.setItem("theme_preference", theme);
      resizeCanvas();
    }

    btnThemeToggle.addEventListener("click", () => {
      const currentTheme = htmlElement.getAttribute("data-theme");
      applyTheme(currentTheme === "dark" ? "light" : "dark");
    });

    // -------------------------------------------------------------
    // CANVAS DE ASSINATURA DIGITAL (HD + TOUCH)
    // -------------------------------------------------------------
    function resizeCanvas() {
      if (!canvas) return;
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const rect = canvas.getBoundingClientRect();
      
      let tempImage = null;
      if (hasSigned) tempImage = canvas.toDataURL();

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const styles = getComputedStyle(document.documentElement);
      ctx.strokeStyle = styles.getPropertyValue('--pen-color').trim() || "#002244";

      if (tempImage && hasSigned) {
        const img = new Image();
        img.src = tempImage;
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
      }
    }

    window.addEventListener("resize", resizeCanvas);

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      hasSigned = true;
      placeholder.style.display = "none";
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    canvas.addEventListener("touchstart", startDrawing, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDrawing);

    document.getElementById("btnClearSignature").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasSigned = false;
      placeholder.style.display = "block";
    });

    // -------------------------------------------------------------
    // CONVERSOR AUTOMÁTICO DE VALOR PARA EXTENSO (R$)
    // -------------------------------------------------------------
    function valorPorExtenso(v) {
      v = parseFloat(v);
      if (isNaN(v) || v <= 0) return "";
      
      const unidades = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
      const dezenas1 = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
      const dezenas2 = ["", "", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
      const centenas = ["", "cento", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];

      function conv(n) {
        if (n === 100) return "cem";
        let c = Math.floor(n / 100);
        let d = Math.floor((n % 100) / 10);
        let u = n % 10;
        let res = [];
        if (c > 0) res.push(centenas[c]);
        if (d === 1) {
          res.push(dezenas1[u]);
        } else {
          if (d > 1) res.push(dezenas2[d]);
          if (u > 0) res.push(unidades[u]);
        }
        return res.join(" e ");
      }

      let inteiros = Math.floor(v);
      let centavos = Math.round((v - inteiros) * 100);
      let partes = [];
      
      if (inteiros > 0) {
        let milhoes = Math.floor(inteiros / 1000000);
        let mil = Math.floor((inteiros % 1000000) / 1000);
        let restos = inteiros % 1000;

        if (milhoes > 0) partes.push(milhoes === 1 ? "um milhão" : conv(milhoes) + " milhões");
        if (mil > 0) partes.push(mil === 1 ? "um mil" : conv(mil) + " mil");
        if (restos > 0) partes.push(conv(restos));
        partes.push(inteiros === 1 ? "real" : "reais");
      }

      if (centavos > 0) {
        if (partes.length > 0) partes.push("e");
        partes.push(conv(centavos));
        partes.push(centavos === 1 ? "centavo" : "centavos");
      }

      let txt = partes.join(" ");
      return txt ? txt.charAt(0).toUpperCase() + txt.slice(1) : "";
    }

    document.getElementById("amount").addEventListener("input", (e) => {
      document.getElementById("amountWords").value = valorPorExtenso(e.target.value);
    });

    // -------------------------------------------------------------
    // VALIDAÇÃO OFICIAL DE CPF/CNPJ (MÓDULO 11)
    // -------------------------------------------------------------
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]+/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(9, 10))) return false;

      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(10, 11))) return false;

      return true;
    }

    function validarCNPJ(cnpj) {
      cnpj = cnpj.replace(/[^\d]+/g, '');
      if (cnpj.length !== 14 || /^(\d)\1{13}$/.test(cnpj)) return false;

      let tamanho = cnpj.length - 2;
      let numeros = cnpj.substring(0, tamanho);
      let digitos = cnpj.substring(tamanho);
      let soma = 0, pos = tamanho - 7;

      for (let i = tamanho; i >= 1; i--) {
        soma += numeros.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
      }
      let resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
      if (resultado != digitos.charAt(0)) return false;

      tamanho = tamanho + 1;
      numeros = cnpj.substring(0, tamanho);
      soma = 0; pos = tamanho - 7;
      for (let i = tamanho; i >= 1; i--) {
        soma += numeros.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
      }
      resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
      if (resultado != digitos.charAt(1)) return false;

      return true;
    }

    function validarCpfCnpj(valor) {
      const limpo = valor.replace(/[^\d]+/g, '');
      if (limpo.length === 11) return validarCPF(limpo);
      if (limpo.length === 14) return validarCNPJ(limpo);
      return false;
    }

    function aplicarMascaraCpfCnpj(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length <= 11) {
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      } else {
        v = v.replace(/^(\d{2})(\d)/, '$1.$2');
        v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
        v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
        v = v.replace(/(\d{4})(\d)/, '$1-$2');
      }
      input.value = v;
    }

    const payerCpfInput = document.getElementById("payerCpf");
    const receiverCpfInput = document.getElementById("receiverCpf");

    [payerCpfInput, receiverCpfInput].forEach(input => {
      input.addEventListener("input", () => {
        aplicarMascaraCpfCnpj(input);
        if (input.classList.contains("invalid")) validarCampoCpf(input);
      });
      input.addEventListener("blur", () => validarCampoCpf(input));
    });

    function validarCampoCpf(input) {
      if (!input.value.trim() || !validarCpfCnpj(input.value)) {
        input.classList.add("invalid");
        return false;
      } else {
        input.classList.remove("invalid");
        return true;
      }
    }

    // -------------------------------------------------------------
    // GERADOR DE PDF DIRETO
    // -------------------------------------------------------------
    async function baixarPDF() {
      const element = document.getElementById("receiptCard");
      const numRecibo = document.getElementById("receiptNumber").innerText.replace(/[^a-zA-Z0-9-]/g, "");
      
      const topBar = document.querySelector(".top-bar");
      const actions = document.querySelector(".actions");
      const btnClear = document.getElementById("btnClearSignature");

      topBar.style.display = "none";
      actions.style.display = "none";
      btnClear.style.display = "none";

      const opt = {
        margin:       10,
        filename:     `Recibo_${numRecibo}.pdf`,
        image:        { type: "jpeg", quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: "mm", format: "a4", orientation: "portrait" }
      };

      await html2pdf().set(opt).from(element).save();

      topBar.style.display = "flex";
      actions.style.display = "grid";
      btnClear.style.display = "inline-block";
    }

    // -------------------------------------------------------------
    // COMPARTILHAR VIA WHATSAPP
    // -------------------------------------------------------------
    function compartilharWhatsApp() {
      const num = document.getElementById("receiptNumber").innerText;
      const valor = document.getElementById("amount").value;
      const pagador = document.getElementById("payer").value;
      const recebedor = document.getElementById("receiver").value;
      const data = document.getElementById("date").value;

      if (!valor || !pagador || !recebedor) {
        alert("⚠️ Preencha os campos principais antes de compartilhar.");
        return;
      }

      const texto = `*RECIBO DE PAGAMENTO - ${num}*\n\n` +
                    `*Valor:* R$ ${valor}\n` +
                    `*Data:* ${data}\n` +
                    `*Pagador:* ${pagador}\n` +
                    `*Recebedor:* ${recebedor}\n\n` +
                    `_Recibo gerado e assinado digitalmente._`;
      
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(url, "_blank");
    }

    // -------------------------------------------------------------
    // INICIALIZAÇÃO E ENVIO DO FORMULÁRIO (WEB3FORMS FREE)
    // -------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date();
      document.getElementById("date").value = today.toISOString().split('T')[0];
      
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      const dateStr = today.toISOString().replace(/[-T:]/g, "").slice(0, 8);
      document.getElementById("receiptNumber").innerText = `Nº #REC-${dateStr}-${randomNum}`;

      applyTheme(localStorage.getItem("theme_preference") || "light");
    });

    document.getElementById("receiptForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.target;
      const inputs = form.querySelectorAll("input[required], textarea[required]");
      let formValid = true;

      inputs.forEach(input => {
        if (!input.value.trim()) {
          input.classList.add("invalid");
          formValid = false;
        } else {
          input.classList.remove("invalid");
        }
      });

      const isPayerCpfValid = validarCampoCpf(payerCpfInput);
      const isReceiverCpfValid = validarCampoCpf(receiverCpfInput);

      if (!formValid || !isPayerCpfValid || !isReceiverCpfValid) {
        alert("⚠️ Por favor, preencha todos os campos obrigatórios e corrija os CPFs/CNPJs inválidos.");
        return;
      }

      if (!hasSigned) {
        alert("⚠️ Por favor, desenhe a assinatura digital antes de enviar.");
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.innerText = "Enviando...";

      try {
        // Converter a assinatura para formato de texto de imagem (Base64) - 100% suportado no plano grátis do Web3Forms
        const signatureImageData = canvas.toDataURL("image/png");
        const receiptNum = document.getElementById("receiptNumber").innerText;

        const formData = new FormData();
        formData.append("access_key", "72c7d6e0-6e51-44f9-a3a4-357b6d12494a");
        formData.append("subject", `Novo Recibo Assinado - ${receiptNum}`);
        formData.append("from_name", "Sistema de Recibos");
        
        formData.append("Numero_Recibo", receiptNum);
        formData.append("Valor_RS", document.getElementById("amount").value);
        formData.append("Data_Pagamento", document.getElementById("date").value);
        formData.append("Nome_Pagador", document.getElementById("payer").value);
        formData.append("CPF_CNPJ_Pagador", document.getElementById("payerCpf").value);
        formData.append("Email_Pagador", document.getElementById("payerEmail").value);
        formData.append("Valor_Por_Extenso", document.getElementById("amountWords").value);
        formData.append("Descricao", document.getElementById("description").value);
        formData.append("Nome_Recebedor", document.getElementById("receiver").value);
        formData.append("CPF_CNPJ_Recebedor", document.getElementById("receiverCpf").value);
        
        // Envio como campo de texto digital
        formData.append("Assinatura_Digital_Base64", signatureImageData);

        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          alert("✅ Recibo e assinatura enviados com sucesso para o seu e-mail!");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          hasSigned = false;
          placeholder.style.display = "block";
        } else {
          alert("⚠️ Erro ao enviar o recibo: " + result.message);
        }
      } catch (error) {
        alert("❌ Ocorreu um erro na conexão. Tente novamente.");
        console.error(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    });
  </script>
